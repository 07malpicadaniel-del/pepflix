server {
    listen 8085;
    listen [::]:8085;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión eficiente para recursos estáticos
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml text/vtt;

    # Tipos MIME PWA y subtítulos
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/manifest+json             webmanifest;
        application/json                      json;
        text/vtt                              vtt;
        image/svg+xml                         svg;
        image/png                             png;
    }

    # Cabeceras de seguridad (aplicación 100% local-first sin llamadas externas)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob:;" always;

    # Endpoint de salud para probes de Kubernetes y Docker/Podman
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sin caché agresivo para Service Worker y manifest
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
