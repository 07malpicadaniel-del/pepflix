# ==============================================================================
# Módulo 7 — Stack de Automatización (*arr): Prowlarr, Radarr, Sonarr, Lidarr, Bazarr
# - Imágenes oficiales `lscr.io/linuxserver/*:latest` verificadas para linux/arm64
# - Volumen único `/data` apuntando a `/mnt/storage` (SIN subPath) para garantizar
#   hardlinks atómicos entre `/data/torrents/*` y `/data/media/*` + `/data/recycle_bin/*`
# - Ejecutado preferentemente en `rpi-master` (gestión e indexación)
# - Uso exclusivo con contenido propio, dominio público, Creative Commons y fuentes legales
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PROWLARR — Gestor Centralizado de Indexers y Trackers Abiertos/Legales
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: homelab-media
  labels:
    app: prowlarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rpi-master
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9696
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Madrid
            - name: UMASK
              value: "002"
          volumeMounts:
            - name: storage
              mountPath: /config
              subPath: appdata/prowlarr
          livenessProbe:
            httpGet:
              path: /ping
              port: 9696
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 9696
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 400m
              memory: 256Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: homelab-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: homelab-media
  labels:
    app: prowlarr
spec:
  type: ClusterIP
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: 9696

---
# ------------------------------------------------------------------------------
# 2. RADARR — Automatización de Películas y Documentales (Hardlinks + Recycle Bin)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: homelab-media
  labels:
    app: radarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - rpi-master
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7878
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Madrid
            - name: UMASK
              value: "002"
          volumeMounts:
            - name: storage
              mountPath: /config
              subPath: appdata/radarr
            # Montaje raíz único de /mnt/storage -> /data para hardlinks atómicos
            # Rutas internas: /data/torrents/movies -> /data/media/movies | Papelera: /data/recycle_bin/movies
            - name: storage
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 7878
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 600m
              memory: 320Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: homelab-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: homelab-media
  labels:
    app: radarr
spec:
  type: ClusterIP
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: 7878

